# macOS build + release pipeline for NeuroPause.
#
# Mirror of windows-release.yml for the macOS target. It builds the macOS
# artifacts (.dmg + .zip, arm64) on a macos-latest runner and, on a tag push,
# publishes them to a GitHub Release. Signing and notarization turn on
# automatically when the credential secrets are present and are skipped
# (clean unsigned build, no failure) when they are absent — matching the
# env-driven signing wired into electron-builder.yml and scripts/notarize.cjs.
#
# NOTE: macOS code-signing + notarization cannot be exercised in the NeuroPause
# CI/dev environment (no Apple "Developer ID Application" certificate, no
# app-specific password, no macOS runner available for local verification).
# This workflow is therefore the *automation* for signing; the signed/notarized
# path itself is only exercised once the secrets below are populated in a real
# macos-latest run. Until then every run produces a verified UNSIGNED build.
name: macos-release

on:
  # Manual runs (build + artifacts, no release) from the Actions tab.
  workflow_dispatch:
  # Tag pushes like v1.0.0-rc.2 build AND publish a GitHub Release.
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release and upload assets

jobs:
  macos:
    runs-on: macos-latest
    # P13C ROUND 25 — W-3. Evaluated at JOB level, where the `secrets` context
    # is available. Holds a boolean, never the key: a step `if:` can read `env`,
    # cannot read `secrets`, and must not need the secret's value to decide
    # whether the secret exists.
    env:
      HAS_DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # A tag release must ship the version it claims: fail fast when the tag
      # (e.g. v1.0.0-rc.14) does not equal apps/desktop/package.json "version".
      # Tags are unique, so this also makes publishing the same app version
      # twice impossible — the historical rc.2…rc.13 tags all shipped as
      # "1.0.0-rc.1" because nothing enforced this.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e '
            const v = require("./apps/desktop/package.json").version;
            const tag = (process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            if (tag !== v) {
              console.error("Tag " + tag + " does not match package version " + v + " - bump both package.json versions before tagging.");
              process.exit(1);
            }
            console.log("Tag matches package version " + v);
          '

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:release

      - name: Lint
        run: npm run lint:release

      - name: Test
        run: npm run test:release

      # Package the macOS .dmg + .zip (arm64). The backend URL is baked into
      # build-info.json by generate-build-info.cjs (same mechanism as Windows).
      #
      # Signing is opt-in and fail-open-to-unsigned:
      #   * When APPLE_CSC_LINK (a base64 .p12 or file URL) is present we export
      #     CSC_LINK / CSC_KEY_PASSWORD so electron-builder signs with the
      #     "Developer ID Application" certificate.
      #   * When it is absent we set CSC_IDENTITY_AUTO_DISCOVERY=false so
      #     electron-builder produces a clean UNSIGNED build instead of failing
      #     while hunting for a keychain identity that isn't there.
      #   * APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are passed
      #     through for scripts/notarize.cjs, which no-ops (un-notarized build,
      #     no failure) when any of the three is missing.
      # Adding the real secrets later turns signing + notarization on with no
      # further edit to this file.
      - name: Package macOS
        env:
          NEUROPAUSE_BACKEND_URL: ${{ vars.NEUROPAUSE_BACKEND_URL || 'https://api.neuropause033.com' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          APPLE_CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
        working-directory: apps/desktop
        run: |
          # P13C ROUND 23 — SECRETS ARE NOT INTERPOLATED INTO SHELL SOURCE.
          #
          # An expression substituted inside a `run:` block becomes part of the
          # script BEFORE bash sees it. GitHub masks the value in the log, but it
          # is still shell SOURCE: a certificate blob containing a quote, a
          # backtick or a command substitution changes what runs, and any shell
          # trace added later prints the reconstructed line. Passing secrets
          # through `env:` keeps them as variables the shell reads, never as code
          # it parses. (This comment deliberately avoids the expression syntax
          # itself — a comment in a run block is still interpolated.)
          if [ -n "$APPLE_CSC_LINK" ]; then
            export CSC_LINK="$APPLE_CSC_LINK"
            export CSC_KEY_PASSWORD="$APPLE_CSC_KEY_PASSWORD"
            echo "Signing enabled (APPLE_CSC_LINK present)."
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "No signing certificate secret; producing an unsigned build."
          fi
          npm run package:mac
        shell: bash

      # Fail fast if the packaged output is incomplete or the auto-update feed
      # does not match the built binaries — BEFORE anything is published. Reads
      # only apps/desktop/dist (no certs, secrets, or network).
      - name: Verify release artifacts
        working-directory: apps/desktop
        run: node scripts/verify-release-artifacts.cjs --platform mac
        shell: bash

      # ARTIFACTS FIRST. P13C ROUND 17m.
      #
      # This step used to sit BELOW the two publish steps. On 12 Aug the Windows
      # build packaged and verified successfully, then `scp` to the droplet timed
      # out and the job died — taking the installer with it. A 23-minute build
      # produced a correct artifact and delivered nothing, because an unrelated
      # third-party host was down. The macOS workflow had the same ordering and
      # therefore the same latent failure; it is corrected here too rather than
      # left to be discovered by a second lost build.
      #
      # The build output is saved BEFORE anything touches the network.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neuropause-macos
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

      # PUBLISHING TO neuropause033.com IS OFF. P13C ROUND 17m.
      #
      # Founder-test builds are handed over as a direct download first; the
      # public download page is turned on afterwards, deliberately. Set the repo
      # variable PUBLISH_TO_SITE to 'true' to re-enable — the secret's presence
      # is no longer sufficient on its own, because "a key exists" was never the
      # same question as "we intend to publish this build".
      #
      # `continue-on-error` because the comment below used to claim this step
      # "never fails the build" while nothing in the step made that true. An
      # unreachable droplet is now what it should always have been: a warning on
      # a green build, not the loss of the artifact.
      # Self-hosted download (Option C): copy the .dmg to the droplet so it's
      # served from neuropause033.com/downloads/ with no GitHub login. Runs only
      # Gated on PUBLISH_TO_SITE (see above) and marked continue-on-error, so it
      # genuinely cannot fail the build — which is what this line used to claim.
      - name: Publish installer to neuropause033.com
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        # P13C ROUND 25 — W-3. THE ROUND 23 CORRECTION WAS ITSELF WRONG.
        #
        # Round 23 found this reading `env.DEPLOY_SSH_KEY != ''` against the
        # step's OWN `env:` block, which a step `if:` cannot see — so the guard
        # was always false and the publish path was unreachable. That diagnosis
        # was right. The fix was not: it changed the reference to `secrets.`,
        # and `secrets` is NOT an allowed context in `steps[*].if`. GitHub
        # rejected the whole file with "Unrecognized named-value: 'secrets'",
        # so from that commit onward the workflow would not parse and could not
        # be dispatched at all — a repair that broke more than the defect.
        #
        # `HAS_DEPLOY_KEY` is computed in the JOB-level `env:` block, where
        # `secrets` IS available, and holds only the boolean 'true'/'false'.
        # The key itself stays in the step `env:` that needs it, so this does
        # not widen the secret's exposure to every step in the job.
        if: ${{ vars.PUBLISH_TO_SITE == 'true' && env.HAS_DEPLOY_KEY == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          # Stable, version-agnostic name the download page links to.
          cp apps/desktop/dist/NeuroPause-arm64.dmg "NeuroPause.dmg" 2>/dev/null || \
            cp apps/desktop/dist/*.dmg "NeuroPause.dmg"
          scp -o StrictHostKeyChecking=no -i deploy_key "NeuroPause.dmg" \
            root@64.227.128.218:/opt/neuropause-site/website/downloads/NeuroPause.dmg
          rm -f deploy_key
          echo "Installer published to https://neuropause033.com/downloads/NeuroPause.dmg"

      # Auto-update feed (generic provider): copy the electron-updater feed and
      # the update payloads to the droplet path served at
      # https://neuropause033.com/updates/ — the URL baked into the app via
      # electron-builder.yml `publish`. While every build is a pre-release the
      # feed is emitted as beta-mac.yml; alias it to latest-mac.yml so the
      # in-app "stable" channel resolves as well. Runs only when the deploy
      # secret is present; the trailing curl proves the feed is actually
      # reachable over HTTPS (fails the release if the server hides /updates/).
      - name: Publish update feed to neuropause033.com
        # P13C ROUND 25 — W-3. THE ROUND 23 CORRECTION WAS ITSELF WRONG.
        #
        # Round 23 found this reading `env.DEPLOY_SSH_KEY != ''` against the
        # step's OWN `env:` block, which a step `if:` cannot see — so the guard
        # was always false and the publish path was unreachable. That diagnosis
        # was right. The fix was not: it changed the reference to `secrets.`,
        # and `secrets` is NOT an allowed context in `steps[*].if`. GitHub
        # rejected the whole file with "Unrecognized named-value: 'secrets'",
        # so from that commit onward the workflow would not parse and could not
        # be dispatched at all — a repair that broke more than the defect.
        #
        # `HAS_DEPLOY_KEY` is computed in the JOB-level `env:` block, where
        # `secrets` IS available, and holds only the boolean 'true'/'false'.
        # The key itself stays in the step `env:` that needs it, so this does
        # not widen the secret's exposure to every step in the job.
        if: ${{ vars.PUBLISH_TO_SITE == 'true' && env.HAS_DEPLOY_KEY == 'true' && startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          echo "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          ssh -o StrictHostKeyChecking=no -i deploy_key root@64.227.128.218 \
            "mkdir -p /opt/neuropause-site/website/updates"
          scp -o StrictHostKeyChecking=no -i deploy_key \
            apps/desktop/dist/beta*.yml apps/desktop/dist/*-mac.zip apps/desktop/dist/*.blockmap \
            root@64.227.128.218:/opt/neuropause-site/website/updates/
          ssh -o StrictHostKeyChecking=no -i deploy_key root@64.227.128.218 \
            "cd /opt/neuropause-site/website/updates && cp -f beta-mac.yml latest-mac.yml"
          rm -f deploy_key
          curl -fsS https://neuropause033.com/updates/beta-mac.yml | head -n 3

      # ARTIFACTS FIRST. P13C ROUND 17m.
      #
      # This step used to sit BELOW the two publish steps. On 12 Aug the Windows
      # build packaged and verified successfully, then `scp` to the droplet timed
      # out (`connect to host 64.227.128.218 port 22: Connection timed out`,
      # exit 255) and the job died — taking the installer with it. A 23-minute
      # build produced a correct artifact and delivered nothing, because an
      # unrelated third-party host was down.
      #
      # The build output is now saved BEFORE anything touches the network. No
      # step after this one can cost us the thing the job exists to produce.


      # Publish a GitHub Release only for tag pushes. softprops/action-gh-release
      # attaches the .dmg, .zip, and the electron-updater feed file so auto-update
      # works. Marked prerelease for -rc/-beta tags.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # *.yml (not latest*.yml): with publish.channel=beta electron-builder
          # emits the update feed as beta-mac.yml, so a latest*.yml glob would
          # attach no feed and auto-update would have nothing to read.
          files: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.yml
            apps/desktop/dist/*.blockmap
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
