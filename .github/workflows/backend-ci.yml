name: backend-ci

on:
  push:
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/backend/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w @neuropause/backend
      - name: Lint (backend)
        run: npx eslint apps/backend --max-warnings 0
      - name: Test
        run: npm run test -w @neuropause/backend
      - name: Build
        run: npm run build -w @neuropause/backend

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: neuropause-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
