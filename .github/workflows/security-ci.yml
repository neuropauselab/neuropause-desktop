# NP-RELEASE-042 §6–8 / NP-RELEASE-043 §10–13 — CI security controls: SAST,
# secret scanning, DAST. Runs on every push and PR to gate security defects.
#
# All actions are pinned to full commit SHAs (immutable references, per GitHub
# security hardening guidance). checkout/setup-node/upload-artifact reuse the
# exact SHAs already pinned by the governed release workflow
# (neuropause-release.yml). The three security actions were resolved from their
# tags on 18/09/2026:
#   github/codeql-action    v3      -> faaca9a8f6edddba5725ffe5adefdab6669a2eca
#   gitleaks/gitleaks-action v2     -> ff98106e4c7b2bc287b24eaf42907196329070c7
#   zaproxy/action-baseline v0.14.0 -> 7c4deb10e6261301961c86d65d54a516394f9aed
name: security-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the workflow level; jobs widen only as needed.
permissions:
  contents: read

jobs:
  # ── SAST: CodeQL static analysis (JavaScript/TypeScript, security-extended) ──
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          category: sast

  # ── Secret scanning: gitleaks CLI over full history + working tree ────────
  # NP-RELEASE-045 §2 (DECISION_SECRET_SCAN) — the gitleaks-action requires a
  # GITLEAKS_LICENSE for organization repositories, so the scan never executed
  # (NP-044 run 35341111155). The license-free official gitleaks CLI performs
  # the identical scan with the same .gitleaks.toml. Scope is UNCHANGED: full
  # git history (`gitleaks git`) AND the checked-out tree (`gitleaks dir`).
  # Both scans fail the job on any finding (exit code 1). Binary is pinned by
  # version AND sha256 (immutable reference; release asset checksum verified
  # before execution).
  # Complementary control to (not a substitute for) GitHub Secret Protection /
  # push protection, which is a repository-level setting the operator enables.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.24.3 (checksum-pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Secret scan — full git history (fails on any finding)
        run: ./gitleaks git . --config .gitleaks.toml --no-banner --redact --exit-code 1
      - name: Secret scan — checked-out tree (fails on any finding)
        run: ./gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

  # ── DAST: ZAP baseline scan against a locally started backend ─────────────
  # Baseline mode is passive/non-destructive; the target is the ephemeral CI
  # backend, never production.
  dast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neuropause_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build backend
        run: npm run build -w @neuropause/backend
      - name: Start backend for DAST scan
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/neuropause_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: dast-test-secret-dast-test-secret-dast-test-secret
          NODE_ENV: test
          PORT: '4000'
          RUN_MIGRATIONS_ON_BOOT: 'true'
          SEED_STORE_ON_BOOT: 'false'
        run: |
          set -euo pipefail
          node apps/backend/dist/index.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy" >&2
          exit 1
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed
        with:
          target: 'http://localhost:4000'
          rules_file_name: '.zap/rules.tsv'
          # NP-RELEASE-045 §3 (DECISION_DAST) — `-I`: WARN findings are reported
          # (output + retained report artifact) but do not fail the run; FAIL
          # rules in .zap/rules.tsv REMAIN FATAL (zap-baseline exits 1 on FAIL
          # regardless of -I, and fail_action=true fails the job on that).
          # NP-044 measured result: 0 FAIL / 2 WARN / 68 PASS — the job failure
          # was WARN exit-code semantics, not a vulnerability.
          cmd_options: '-a -j -I'
          fail_action: true
          # No issue creation — the job result + uploaded report are the record,
          # and the job then needs no `issues: write` permission.
          allow_issue_writing: false
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zap-report
          path: report_html.html
          if-no-files-found: ignore
