# Local development infrastructure for NeuroPause Desktop.
# Postgres and Redis are used from Phase 1 (auth + sessions).
# they are defined now so the full local stack is one command away.
services:
  postgres:
    image: postgres:16-alpine
    container_name: neuropause-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuropause}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuropause_dev}
      POSTGRES_DB: ${POSTGRES_DB:-neuropause}
    ports:
      - '5432:5432'
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-neuropause}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: neuropause-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    ports:
      - '6379:6379'
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Reserved for later phases ---
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: neuropause-qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - ./.docker-data/qdrant:/qdrant/storage
