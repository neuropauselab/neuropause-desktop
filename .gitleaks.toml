# Gitleaks configuration for NeuroPause secret scanning (NP-RELEASE-043 §12).
#
# POLICY: no blanket path allowlists. A test file can contain a real credential,
# so `*.test.ts` / `__test__` / vitest globs are NOT excluded. Every entry below
# is a specific value (or one sealed-evidence path) triaged on 18/09/2026 and
# verified synthetic. Full triage: 57 findings, 23 distinct values, 0 real
# credentials (NP-RELEASE-043 secret-scan audit).
title = "NeuroPause Secret Scanning"

[extend]
useDefault = true

[allowlist]
description = "Exact known-synthetic values, each traceable to its defining file"
regexes = [
  # backend test JWT secrets (jwt.test.ts, users/service.test.ts, vitest.config.ts)
  '''test-secret-test-secret-test-secret-123456''',
  '''test-only-secret-test-only-secret-0123456789''',
  # CI ephemeral backend secret (security-ci.yml DAST job)
  '''dast-test-secret-dast-test-secret-dast-test-secret''',
  # device test fixture pseudo public key ("test-public-key-for-unit-test" b64)
  '''dGVzdC1wdWJsaWMta2V5LWZvci11bml0LXRlc3Q''',
  # deploy example placeholder (deploy/kubernetes/secret.example.yaml)
  '''CHANGE_ME_min_32_chars_of_random_entropy_here_xxxx''',
  # Pulumi's PUBLIC secret-signature magic constant (iacState.ts) — documented
  # upstream, not a credential
  '''4dabf18193072939515e22adb298388d''',
  # redaction/tenancy test fixtures (assistantConversationTenancy, semanticRouter,
  # founderAI, conversationMemory, tokenService, ecosystem jwt tests)
  '''NP-CONVERSATION-[AB]-SECRET-\d+''',
  '''sk-live-SECRET-9f3a''',
  '''sk_live_51H8xQ2eZvKYlo2C''',
  '''sk_live_ABCDEFGHIJKLMNOP1234''',
  '''sk_live_abcdef1234''',
  '''svc-secret-0123456789''',
  '''test-signing-secret-0123456789''',
  '''abcdef123456ghijkl''',
  '''key-abcdef1234567890''',
  '''abcdef1234567890''',
  # synthetic PAT: the alphabet (conversationMemory.test.ts redaction fixture)
  '''ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789''',
  # synthetic JWTs used ONLY to test log/vault redaction (payloads: user1,
  # attacker, 1234567890, GARBLED — none issued by any real authority)
  '''eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9-GARBLED''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODk''',
  '''eyJhbGciOiJSUzI1NiJ9\.eyJzdWIiOiJ1c2VyMSJ9''',
  '''eyJhbGciOiJSUzI1NiJ9\.eyJzdWIiOiJhdHRhY2tlciJ9''',
  '''eyJ0eXAiOiJKV1QiLCJh(?:[A-Za-z0-9+/=_-]{0,8})$''',
  # doc-text false positives (prose matched by generic-api-key's keyword+entropy
  # heuristic; neither line contains a credential)
  '''capabilities/dependencies/permissions/''',
  '''parent/child''',
]
paths = [
  # GENERATED build output (untracked; never present in a CI checkout). Its
  # sources are scanned; the flagged strings are identifier names, not values.
  '''apps/desktop/out/''',
  # HISTORICAL committed build bundle (removed from the tree; identifier names
  # subjectMatchKey/apiQuotaRemaining flagged at commit cec399ff, not values)
  '''apps/desktop/index\.js''',
  # SEALED runtime evidence (NP-RELEASE-042 §35: never edit sealed artifacts in
  # place). The flagged values are npsign_/npfed_ ephemeral key IDENTIFIERS
  # generated by a local install during the rc.20 certification run — they name
  # local key handles and grant no external access. Scoped to this one
  # directory only.
  '''certification/windows-runtime-evidence-rc20/''',
]

# Additional rule beyond the defaults: a committed literal JWT_ACCESS_SECRET.
[[rules]]
  id = "neuropause-jwt-secret"
  description = "Hardcoded NeuroPause JWT secret assignment"
  regex = '''JWT_ACCESS_SECRET\s*[:=]\s*['"][^'"]{32,}['"]'''
  tags = ["secret", "jwt"]
  [rules.allowlist]
    regexes = [
      '''test-only-secret-test-only-secret-0123456789''',
      '''CHANGE_ME_min_32_chars_of_random_entropy_here_xxxx''',
    ]
