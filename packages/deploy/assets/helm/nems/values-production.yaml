# Production overrides.
replicaCount: 3
image:
  tag: stable
  pullPolicy: IfNotPresent
ingress:
  enabled: true
  host: app.nems.example.com
  tls: true
resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: 2000m, memory: 2Gi }
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
config:
  nodeEnv: production
  logLevel: info
