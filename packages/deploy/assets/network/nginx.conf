# NEMS reverse proxy / edge configuration. Real TLS certificates are mounted at deploy time;
# none are embedded here.
worker_processes auto;
events { worker_connections 1024; }

http {
  sendfile on;
  server_tokens off;

  # rate limiting
  limit_req_zone $binary_remote_addr zone=nems_api:10m rate=20r/s;

  upstream nems_api { server api:8080; }

  # HTTP -> HTTPS redirect
  server {
    listen 80;
    server_name app.nems.example.com;
    return 301 https://$host$request_uri;
  }

  # HTTPS edge
  server {
    listen 443 ssl;
    server_name app.nems.example.com;

    ssl_certificate     /etc/nginx/tls/tls.crt;   # mounted from a secret; not in this repo
    ssl_certificate_key /etc/nginx/tls/tls.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Frame-Options "DENY" always;

    location / {
      limit_req zone=nems_api burst=40 nodelay;
      proxy_pass http://nems_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
