# NeuroPause NEMS — production docker-compose overlay.
# Production-shaped topology with the production image target, replicas, resource limits, and
# restart policies. Secrets are injected from the environment / a secrets manager — NEVER hard-coded.
name: nems-production

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4G }

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes: ["redisdata:/data"]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes: ["qdrantdata:/qdrant/storage"]
    restart: unless-stopped

  api:
    build:
      context: ../../../..
      dockerfile: packages/deploy/assets/docker/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits: { cpus: "1.0", memory: 1G }
      restart_policy: { condition: on-failure, max_attempts: 3 }

  workers:
    build:
      context: ../../../..
      dockerfile: packages/deploy/assets/docker/Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    restart: unless-stopped
    deploy:
      replicas: 2

  ai-runtime:
    build:
      context: ../../../..
      dockerfile: packages/deploy/assets/docker/Dockerfile
      target: ai-runtime
    environment:
      NODE_ENV: production
      OLLAMA_URL: ${OLLAMA_URL}
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    ports: ["443:443", "80:80"]
    volumes:
      - "../network/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  qdrantdata:
