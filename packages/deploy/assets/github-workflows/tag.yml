name: Tag
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag (e.g. 1.2.0)
        required: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate + create tag
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
