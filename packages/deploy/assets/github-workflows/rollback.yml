name: Rollback
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Helm revision to roll back to
        required: true
      environment:
        description: Target environment
        required: true
        default: staging

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}    # gated by environment approval
    steps:
      - uses: actions/checkout@v4
      - name: Roll back Helm release
        run: |
          echo "helm rollback nems ${{ inputs.revision }} --namespace nems-${{ inputs.environment }}"
          # executed against the real cluster by the operator's configured kubeconfig
