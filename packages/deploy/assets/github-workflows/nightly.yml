name: Nightly Build
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Full suite
        run: |
          npx tsc -p tsconfig.base.json --noEmit
          npx eslint packages --max-warnings 0
          NODE_OPTIONS=--max-old-space-size=8192 npx vitest run packages
