name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -p tsconfig.base.json --noEmit
      - name: Lint
        run: npx eslint packages --max-warnings 0
      - name: Test
        run: NODE_OPTIONS=--max-old-space-size=8192 npx vitest run packages
