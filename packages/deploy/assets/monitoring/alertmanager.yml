# NEMS Alertmanager routing (represents intended routing; receivers are placeholders).
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers: ['severity="critical"']
      receiver: oncall

receivers:
  - name: default
  - name: oncall
    webhook_configs:
      - url: "REPLACED_BY_SECRET"     # e.g. PagerDuty/Slack webhook injected from secrets manager
        send_resolved: true
