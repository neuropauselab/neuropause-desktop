# NEMS NetworkPolicy — default-deny ingress, allow API from ingress-nginx and intra-namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nems-default-deny
  namespace: nems-production
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nems-api-allow
  namespace: nems-production
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: nems-api }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 8080 }
