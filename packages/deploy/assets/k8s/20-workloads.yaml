# NEMS workloads — API Deployment, PostgreSQL StatefulSet, Redis Deployment, node-exporter DaemonSet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nems-api
  namespace: nems-production
  labels: { app.kubernetes.io/name: nems-api, app.kubernetes.io/part-of: nems }
spec:
  replicas: 3
  selector:
    matchLabels: { app.kubernetes.io/name: nems-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nems-api }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: api
          image: ghcr.io/neuropause/nems:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: nems-config }
            - secretRef: { name: nems-secrets }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
          startupProbe:
            httpGet: { path: /health/startup, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nems-postgres
  namespace: nems-production
spec:
  serviceName: nems-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nems-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nems-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [{ containerPort: 5432 }]
          envFrom:
            - secretRef: { name: nems-secrets }
          volumeMounts: [{ name: pgdata, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: pgdata }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 50Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nems-redis
  namespace: nems-production
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nems-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nems-redis }
    spec:
      containers:
        - name: redis
          image: redis:7
          ports: [{ containerPort: 6379 }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: nems-production
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: node-exporter }
  template:
    metadata:
      labels: { app.kubernetes.io/name: node-exporter }
    spec:
      hostNetwork: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:latest
          ports: [{ containerPort: 9100 }]
