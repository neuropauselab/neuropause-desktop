# NEMS Services — API (ClusterIP), PostgreSQL (headless), Redis (ClusterIP).
apiVersion: v1
kind: Service
metadata:
  name: nems-api
  namespace: nems-production
spec:
  selector: { app.kubernetes.io/name: nems-api }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: nems-postgres
  namespace: nems-production
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: nems-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata:
  name: nems-redis
  namespace: nems-production
spec:
  selector: { app.kubernetes.io/name: nems-redis }
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
