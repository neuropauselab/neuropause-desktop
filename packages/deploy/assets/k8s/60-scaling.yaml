# NEMS scaling & availability — HorizontalPodAutoscaler + PodDisruptionBudget for the API.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nems-api-hpa
  namespace: nems-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nems-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nems-api-pdb
  namespace: nems-production
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: nems-api }
