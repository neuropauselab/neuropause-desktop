<?xml version="1.0" encoding="UTF-8"?>
<!--
  NeuroPause application icon (source).
  Concept: a "pause" glyph (two rounded bars) on a calm indigo squircle,
  with a faint neural-synapse motif that recedes at small sizes.
  This is the editable master; icon.icns / icon.ico / icon.png are generated
  from it. Replace with final brand art if desired — the build wiring will
  pick up the regenerated assets automatically.
  Canvas 1024x1024. Squircle content 896x896 centred, ~6% margin, soft shadow.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: indigo-violet, top-left highlight to deep base -->
    <linearGradient id="bg" x1="140" y1="120" x2="900" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="0.52" stop-color="#5B49E8"/>
      <stop offset="1" stop-color="#271C63"/>
    </linearGradient>
    <!-- Soft top-left sheen for depth -->
    <radialGradient id="sheen" cx="0.32" cy="0.26" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Bar gradient: crisp white to faint lilac -->
    <linearGradient id="bar" x1="0" y1="362" x2="0" y2="662" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECE9FF"/>
    </linearGradient>
    <!-- Drop shadow for macOS realism -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#160F3A" flood-opacity="0.34"/>
    </filter>
    <!-- Subtle inner top highlight on the squircle edge -->
    <linearGradient id="edge" x1="0" y1="64" x2="0" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.14" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle body -->
  <g filter="url(#shadow)">
    <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>
  </g>
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#sheen)"/>

  <!-- Faint neural-synapse motif (recedes at small sizes) -->
  <g stroke="#FFFFFF" stroke-opacity="0.10" fill="#FFFFFF" fill-opacity="0.10" stroke-width="5">
    <line x1="250" y1="250" x2="360" y2="360"/>
    <line x1="360" y1="360" x2="300" y2="470"/>
    <line x1="674" y1="774" x2="770" y2="666"/>
    <line x1="770" y1="666" x2="712" y2="560"/>
    <circle cx="250" cy="250" r="13"/>
    <circle cx="360" cy="360" r="10"/>
    <circle cx="300" cy="470" r="8"/>
    <circle cx="770" cy="666" r="13"/>
    <circle cx="712" cy="560" r="9"/>
  </g>

  <!-- Pause glyph: two rounded bars -->
  <g fill="url(#bar)">
    <rect x="402" y="362" width="80" height="300" rx="40" ry="40"/>
    <rect x="542" y="362" width="80" height="300" rx="40" ry="40"/>
  </g>

  <!-- Edge highlight overlay -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#edge)"/>
</svg>
