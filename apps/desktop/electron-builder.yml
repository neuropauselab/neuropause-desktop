appId: com.neuropause.desktop
productName: NeuroPause
copyright: "Copyright \xA9 NeuroPause"
directories:
  output: dist
  buildResources: resources
asar: true
asarUnpack:
- resources/plugin-host.cjs
files:
- out/**/*
- package.json
# S55 (S54 hygiene observation): the asar packs workspace-package node_modules whose
# trees carry 87 *.test.ts files (~0.31MB). Raw TypeScript cannot be require()d and the
# measured bundles contain zero requires of any .ts path, so exclusion is runtime-safe.
# Deliberately NOT excluding src/*.ts wholesale — workspace deps declare TS mains and
# the vendored CST kernel's runtime files must stay (a broader exclusion is unproven).
- '!**/*.test.ts'
extraResources:
- from: resources/build-info.json
  to: build-info.json
# Phase 8 (8.8): OSS attribution ships inside every distributed binary.
- from: resources/THIRD-PARTY-NOTICES.md
  to: THIRD-PARTY-NOTICES.md
# Phase 8 (8.14): bundle the pilot documentation set (in-app help opens these).
- from: ../../docs/guides
  to: docs/guides
- from: ../../docs/user
  to: docs/user
- from: ../../docs/legal
  to: docs/legal
- from: resources/THIRD-PARTY-NOTICES.md
  to: docs/THIRD-PARTY-NOTICES.md
afterSign: scripts/notarize.cjs
# Auto-update feed: generic HTTPS provider on our own server. The GitHub repo is
# private, so customer updaters can never read its Releases anonymously — the
# release workflows copy the feed (beta*.yml) + update payloads to
# /opt/neuropause-site/website/updates/ on the droplet, served at this URL.
# channel=beta keeps the feed name beta-mac.yml / beta.yml while every build is
# a pre-release; the workflows alias it to latest*.yml so the in-app "stable"
# channel resolves too. Revisit at the first non-RC release.
publish:
  provider: generic
  url: https://neuropause033.com/updates
  channel: beta
mac:
  category: public.app-category.productivity
  icon: icon.icns
  # Universal, not arm64-only. Intel Macs are still a large share of the installed
  # base and an arm64-only build gives them nothing — the app simply will not launch.
  # Universal is chosen over shipping separate arm64 + x64 artifacts because:
  #   * the desktop has NO native modules (0 *.node in the tree; deps are pure JS),
  #     so there is no per-arch rebuild to get wrong;
  #   * one artifact means a user cannot download the wrong one, and download.html
  #     needs no architecture detection;
  #   * the update feed stays a single beta-mac.yml entry, leaving the existing
  #     publish path in the release workflows untouched.
  # The cost is size: a universal build carries both Electron slices.
  target:
  - target: dmg
    arch:
    - universal
  - target: zip
    arch:
    - universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  notarize: false
dmg:
  contents:
  - x: 130
    y: 220
  - x: 410
    y: 220
    type: link
    path: /Applications
  artifactName: NeuroPause-${arch}.${ext}
win:
  icon: icon.ico
  target:
  - target: nsis
    arch:
    - x64
  - target: zip
    arch:
    - x64
  - target: portable
    arch:
    - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NeuroPause
  artifactName: NeuroPause-Setup.${ext}
