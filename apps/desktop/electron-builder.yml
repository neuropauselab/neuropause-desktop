appId: com.neuropause.desktop
productName: NeuroPause
copyright: "Copyright \xA9 NeuroPause"
directories:
  output: dist
  buildResources: resources
asar: true
asarUnpack:
- resources/plugin-host.cjs
files:
- out/**/*
- package.json
extraResources:
- from: resources/build-info.json
  to: build-info.json
afterSign: scripts/notarize.cjs
publish:
  provider: github
  owner: dishantdobariya91-debug
  repo: neuropause-desktop
  channel: beta
mac:
  category: public.app-category.productivity
  target:
  - target: dmg
    arch:
    - arm64
  - target: zip
    arch:
    - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  notarize: false
dmg:
  contents:
  - x: 130
    y: 220
  - x: 410
    y: 220
    type: link
    path: /Applications
  artifactName: NeuroPause-${arch}.${ext}
win:
  target:
  - target: nsis
    arch:
    - x64
  - target: zip
    arch:
    - x64
  - target: portable
    arch:
    - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NeuroPause
  artifactName: NeuroPause-Setup.${ext}
