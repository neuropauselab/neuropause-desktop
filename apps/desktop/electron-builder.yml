# ─────────────────────────────────────────────────────────────────────────────
# electron-builder — production packaging configuration.
#
# This file is safe to commit: it contains NO certificates and NO credentials.
# Signing identity and notarization secrets are supplied via environment
# variables at build time (see docs/release/PACKAGING-SIGNING-NOTARIZATION.md):
#
#   CSC_LINK / CSC_KEY_PASSWORD ........ Developer ID Application cert (.p12) + pw
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID .. notarization
#   NEUROPAUSE_UPDATE_URL .............. base URL of the update feed (optional)
#
# `npm run package:dir` builds an UNSIGNED local app (no cert/notarization
# needed). `npm run package:mac` builds the signed, notarized arm64 DMG when the
# variables above are present, and an unsigned DMG when they are not.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.neuropause.desktop
productName: NeuroPause
copyright: Copyright © NeuroPause

directories:
  output: dist
  buildResources: resources

# Compress into asar; the plugin host runtime stays unpacked so it can be spawned.
asar: true
asarUnpack:
  - resources/plugin-host.cjs

files:
  - out/**/*
  - package.json

# build-info.json is generated by scripts/generate-build-info.cjs before packaging
# and read at runtime by src/main/buildInfo.ts (commit / channel / build time).
extraResources:
  - from: resources/build-info.json
    to: build-info.json

# Notarization runs after signing via a hook that no-ops without credentials.
afterSign: scripts/notarize.cjs

# ── Update feed (consumed by electron-updater) ──────────────────────────────
# GitHub Releases: the windows-release CI workflow publishes latest.yml + the
# installer/zip to a GitHub Release on every tag, and electron-updater reads
# that same Release to offer updates. No separate static host is required.
# `channel: beta` means the app tracks beta feeds (beta.yml) for -rc/-beta
# builds; promoting to stable (drop the prerelease at 1.0) switches to latest.yml.
publish:
  provider: github
  owner: dishantdobariya91-debug
  repo: neuropause-desktop
  channel: beta

# ── macOS (first-class target: Apple Silicon) ───────────────────────────────
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip   # zip is what electron-updater downloads for macOS
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # signing identity is taken from CSC_LINK/CSC_KEY_PASSWORD; unset => unsigned.
  notarize: false   # handled explicitly by the afterSign hook

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Windows (NSIS installer + ZIP + portable) ───────────────────────────────
# Additive: does not touch the macOS block above. Built with `npm run
# package:win` ON a Windows host or CI runner (electron-builder cannot emit a
# Windows installer from macOS). Authenticode signing is optional and supplied
# via WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD at build time (unset => unsigned .exe,
# which installs behind a one-time SmartScreen "More info -> Run anyway").
# NOTE: icon.ico is not yet present in resources/ - electron-builder falls back
# to the default Electron icon until one is added (see WINDOWS-BUILD.md Icons).
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip # zip is what electron-updater downloads for Windows
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # icon: resources/icon.ico   # uncomment once the asset exists (256px master)

nsis:
  oneClick: false # show the wizard (dir choice, shortcuts) rather than silent one-click
  perMachine: false # per-user install => no admin elevation required
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NeuroPause

# ── Future targets (structured but not built until enabled) ─────────────────
# Intel macOS: add `- arch: [x64]` (or `universal`) to mac.target above.
# Linux (AppImage + deb):
# linux:
#   target:
#     - target: AppImage
#       arch: [x64]
#     - target: deb
#       arch: [x64]
#   category: Utility
