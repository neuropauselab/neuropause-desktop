# ─────────────────────────────────────────────────────────────────────────────
# electron-builder — production packaging configuration.
#
# This file is safe to commit: it contains NO certificates and NO credentials.
# Signing identity and notarization secrets are supplied via environment
# variables at build time (see docs/release/PACKAGING-SIGNING-NOTARIZATION.md):
#
#   CSC_LINK / CSC_KEY_PASSWORD ........ Developer ID Application cert (.p12) + pw
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID .. notarization
#   NEUROPAUSE_UPDATE_URL .............. base URL of the update feed (optional)
#
# `npm run package:dir` builds an UNSIGNED local app (no cert/notarization
# needed). `npm run package:mac` builds the signed, notarized arm64 DMG when the
# variables above are present, and an unsigned DMG when they are not.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.neuropause.desktop
productName: NeuroPause
copyright: Copyright © NeuroPause

directories:
  output: dist
  buildResources: resources

# Compress into asar; the plugin host runtime stays unpacked so it can be spawned.
asar: true
asarUnpack:
  - resources/plugin-host.cjs

files:
  - out/**/*
  - package.json

# build-info.json is generated by scripts/generate-build-info.cjs before packaging
# and read at runtime by src/main/buildInfo.ts (commit / channel / build time).
extraResources:
  - from: resources/build-info.json
    to: build-info.json

# Notarization runs after signing via a hook that no-ops without credentials.
afterSign: scripts/notarize.cjs

# ── Update feed (consumed by electron-updater) ──────────────────────────────
# `generic` points the app at a static file server hosting the channel feeds
# (latest.yml / beta.yml / internal.yml) and artifacts. Replace the URL with
# your deployment's, or set NEUROPAUSE_UPDATE_URL and override at build time
# with `--config.publish.url=$NEUROPAUSE_UPDATE_URL`.
publish:
  provider: generic
  # Replace with your real RC feed host (S3 / R2 / GitHub Releases / static host).
  url: https://updates.neuropause.example/rc
  # Tracks the active release stage: `beta` for RC / beta builds (generates
  # beta-mac.yml), `latest` for the stable 1.0 promotion. See RC1-RUNBOOK.md.
  channel: beta

# ── macOS (first-class target: Apple Silicon) ───────────────────────────────
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip   # zip is what electron-updater downloads for macOS
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # signing identity is taken from CSC_LINK/CSC_KEY_PASSWORD; unset => unsigned.
  notarize: false   # handled explicitly by the afterSign hook

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Future targets (structured but not built until enabled) ─────────────────
# Intel macOS: add `- arch: [x64]` (or `universal`) to mac.target above.
# Windows (NSIS):
# win:
#   target:
#     - target: nsis
#       arch: [x64]
#   # Authenticode signing via WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
# nsis:
#   oneClick: false
#   perMachine: false
#   allowToChangeInstallationDirectory: true
# Linux (AppImage + deb):
# linux:
#   target:
#     - target: AppImage
#       arch: [x64]
#     - target: deb
#       arch: [x64]
#   category: Utility
