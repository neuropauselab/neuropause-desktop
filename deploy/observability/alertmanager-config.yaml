# NEMS Phase 5 — Alertmanager routing.
# ---------------------------------------------------------------------------
# Routing, grouping and inhibition are fully specified here. Delivery
# DESTINATIONS are intentionally NOT hard-coded: each receiver reads its real
# webhook URL from a Kubernetes Secret the operator creates. Until that secret
# exists, the prometheus-operator REJECTS this AlertmanagerConfig (visible as
# the PrometheusOperatorRejectedResources alert) — delivery never silently
# no-ops.
#
# Current delivery landscape (set during Phase 5 live validation): Slack only.
# Both severity tiers deliver to Slack via one webhook secret:
#   kubectl -n monitoring create secret generic alertmanager-slack \
#     --from-literal=url='https://hooks.slack.com/services/XXX/YYY/ZZZ'
# PagerDuty can be added later by restoring a pagerdutyConfigs block on the
# nems-page receiver plus an alertmanager-pagerduty secret.
# Note: modern Slack webhooks are bound to one channel; the channel fields
# below only take effect with legacy configurable webhooks.
# ---------------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: nems-routing
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: neuropause
    release: kube-prometheus-stack
spec:
  route:
    receiver: nems-ticket           # default: warnings/tickets
    groupBy: ["alertname", "namespace", "severity"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    routes:
      - receiver: nems-page          # anything critical pages
        matchers:
          - name: severity
            value: critical
        repeatInterval: 1h
        continue: false
      - receiver: nems-ticket
        matchers:
          - name: severity
            value: warning
        repeatInterval: 12h
  receivers:
    - name: nems-page
      # Critical tier — Slack critical channel (URL from a Secret).
      slackConfigs:
        - apiURL:
            name: alertmanager-slack
            key: url
          channel: '#nems-oncall-critical'
          sendResolved: true
          title: '[CRITICAL] {{ .CommonLabels.alertname }}'
          text: >-
            {{ range .Alerts }}*{{ .Annotations.summary }}*
            {{ .Annotations.description }}
            Runbook: {{ .Annotations.runbook_url }}
            {{ end }}
    - name: nems-ticket
      slackConfigs:
        - apiURL:
            name: alertmanager-slack
            key: url
          channel: '#nems-oncall'
          sendResolved: true
          title: '[{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }}'
          text: >-
            {{ range .Alerts }}{{ .Annotations.summary }} — {{ .Annotations.description }}
            Runbook: {{ .Annotations.runbook_url }}
            {{ end }}
  inhibitRules:
    # A firing critical for a service suppresses the matching warning for it.
    - sourceMatch:
        - name: severity
          value: critical
      targetMatch:
        - name: severity
          value: warning
      equal: ["alertname", "service"]
