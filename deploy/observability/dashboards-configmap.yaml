# NEMS Phase 5 — Grafana dashboards as a sidecar ConfigMap.
# The kube-prometheus-stack Grafana sidecar imports any ConfigMap labeled
# grafana_dashboard=1. Generated from dashboards/*.json by gen_dashboards.py;
# every panel query targets a real, existing metric.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nems-grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: neuropause
data:
  nems-backend-overview.json: |-
    {
      "uid": "nems-backend-overview",
      "title": "NEMS \u2014 Backend Overview",
      "tags": [
        "nems",
        "backend"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Data source"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Backend target up",
          "type": "stat",
          "description": "1 = Prometheus is scraping the backend pod.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "up{job=\"nems-backend\"}",
              "legendFormat": "{{pod}}",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bool",
              "custom": {}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 2,
          "title": "Available replicas",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "kube_deployment_status_replicas_available{namespace=\"nems-prod\",deployment=\"nems-backend\"}",
              "legendFormat": "available",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 3,
          "title": "Uptime",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(neuropause_backend_uptime_seconds)",
              "legendFormat": "uptime",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 4,
          "title": "Edge availability (/health probe)",
          "type": "stat",
          "description": "/health returns 200 only when DB AND Redis are up, so this is a composite dependency-up signal.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min(probe_success{tier=\"edge\",instance=\"https://api.neuropause033.com/health\"})",
              "legendFormat": "healthy",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bool",
              "custom": {}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 5,
          "title": "TLS cert days remaining",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(min(probe_ssl_earliest_cert_expiry{tier=\"edge\"}) - time()) / 86400",
              "legendFormat": "days",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "custom": {}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 10,
          "title": "HTTP request rate by status",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (status) (rate(neuropause_http_requests_total[5m]))",
              "legendFormat": "{{status}}",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {}
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 11,
          "title": "5xx error ratio",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(rate(neuropause_http_requests_total{status=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(neuropause_http_requests_total[5m])),0.001)",
              "legendFormat": "5xx ratio",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {}
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 12,
          "title": "Memory: RSS & heap",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(neuropause_backend_resident_memory_bytes)",
              "legendFormat": "rss",
              "format": "time_series",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(neuropause_backend_heap_used_bytes)",
              "legendFormat": "heap used",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {}
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 13,
          "title": "Working set vs 512Mi limit",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (pod) (container_memory_working_set_bytes{namespace=\"nems-prod\",container=\"backend\"}) / on(pod) group_left max by (pod)(kube_pod_container_resource_limits{namespace=\"nems-prod\",container=\"backend\",resource=\"memory\"})",
              "legendFormat": "{{pod}}",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {}
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 14,
          "title": "Rate-limit fallback (Redis degraded)",
          "type": "timeseries",
          "description": "Nonzero means Valkey was unavailable and per-instance fallback engaged.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (bucket) (rate(neuropause_ratelimit_fallback_total[5m]))",
              "legendFormat": "{{bucket}}",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 15,
          "title": "PG pool connections",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (state) (neuropause_pg_pool_connections)",
              "legendFormat": "{{state}}",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "options": {}
        }
      ]
    }
  nems-dependencies.json: |-
    {
      "uid": "nems-dependencies",
      "title": "NEMS \u2014 Database & Redis",
      "tags": [
        "nems",
        "dependencies"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Data source"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Dependencies healthy (/health 200)",
          "type": "stat",
          "description": "/health is 200 only when both PostgreSQL and Valkey answer; this is the composite up signal.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min(probe_success{tier=\"edge\",instance=\"https://api.neuropause033.com/health\"})",
              "legendFormat": "db&redis up",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bool",
              "custom": {}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 2,
          "title": "Liveness (/live 200)",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min(probe_success{tier=\"edge\",instance=\"https://api.neuropause033.com/live\"})",
              "legendFormat": "process up",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bool",
              "custom": {}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 3,
          "title": "PG pool waiting",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(neuropause_pg_pool_connections{state=\"waiting\"})",
              "legendFormat": "waiting",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 10,
          "title": "PostgreSQL pool connections",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (state) (neuropause_pg_pool_connections)",
              "legendFormat": "{{state}}",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 11,
          "title": "Dependency up/down transitions (1h)",
          "type": "timeseries",
          "description": "Edge-triggered: each bump is a component flipping up<->down.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (component,state) (increase(neuropause_health_alerts_total[1h]))",
              "legendFormat": "{{component}}/{{state}}",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 12,
          "title": "Redis fallback engagements",
          "type": "timeseries",
          "description": "Managed Valkey internals (memory, hit ratio) are in the DigitalOcean console; this is the app-visible degradation signal.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (bucket) (increase(neuropause_ratelimit_fallback_total[15m]))",
              "legendFormat": "{{bucket}}",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "options": {}
        }
      ]
    }
  nems-kubernetes.json: |-
    {
      "uid": "nems-kubernetes",
      "title": "NEMS \u2014 Kubernetes Resources",
      "tags": [
        "nems",
        "kubernetes"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Data source"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Nodes Ready",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "legendFormat": "ready",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 2,
          "title": "Backend pod restarts (total)",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"nems-prod\",container=\"backend\"})",
              "legendFormat": "restarts",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 10,
          "title": "Node CPU utilisation",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))",
              "legendFormat": "{{instance}}",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {}
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 11,
          "title": "Node memory used",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "{{instance}}",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {}
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 12,
          "title": "Node filesystem free",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay\"}",
              "legendFormat": "{{instance}} {{mountpoint}}",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {}
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 13,
          "title": "Backend pod CPU",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
