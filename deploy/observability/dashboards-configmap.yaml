  nems-slo.json: |-
    {
      "uid": "nems-slo",
      "title": "NEMS \u2014 SLO / Latency / Availability",
      "tags": [
        "nems",
        "slo"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Data source"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Edge availability now",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min(probe_success{tier=\"edge\"})",
              "legendFormat": "up",
              "format": "time_series",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bool",
              "custom": {}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 2,
          "title": "Edge availability (24h)",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
