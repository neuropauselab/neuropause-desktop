# EXAMPLE ONLY — placeholders, not real secrets. Do NOT commit real values.
#
# Prefer creating the Secret out-of-band (kept out of git), or use a
# sealed-secrets / external-secrets operator in production:
#
#   kubectl -n neuropause create secret generic neuropause-backend-secrets \
#     --from-literal=DATABASE_URL='postgresql://user:pass@managed-pg:5432/neuropause' \
#     --from-literal=REDIS_URL='redis://managed-redis:6379' \
#     --from-literal=JWT_ACCESS_SECRET="$(openssl rand -hex 32)"
#
# DATABASE_URL/REDIS_URL should point at MANAGED, highly-available Postgres/Redis.
apiVersion: v1
kind: Secret
metadata:
  name: neuropause-backend-secrets
  namespace: neuropause
  labels:
    app.kubernetes.io/name: neuropause-backend
type: Opaque
stringData:
  DATABASE_URL: "postgresql://neuropause:CHANGE_ME@postgres.example:5432/neuropause"
  REDIS_URL: "redis://redis.example:6379"
  JWT_ACCESS_SECRET: "CHANGE_ME_min_32_chars_of_random_entropy_here_xxxx"
  # Optional integrations — uncomment and set to enable:
  # GOOGLE_CLIENT_ID: ""
  # GOOGLE_CLIENT_SECRET: ""
  # GITHUB_CLIENT_ID: ""
  # GITHUB_CLIENT_SECRET: ""
  # RAZORPAY_KEY_ID: ""
  # RAZORPAY_KEY_SECRET: ""
  # RAZORPAY_WEBHOOK_SECRET: ""
