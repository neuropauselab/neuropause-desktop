# NeuroPause backend — optional autoscaling + ingress.
#
# HPA requires metrics-server in the cluster; Ingress requires an ingress controller
# (nginx assumed) and a cert-manager Secret (neuropause-backend-tls) for TLS. TLS is
# terminated at the ingress — the backend speaks plain HTTP by design (see DEPLOYMENT docs).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neuropause-backend
  namespace: neuropause
  labels:
    app.kubernetes.io/name: neuropause-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neuropause-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuropause-backend
  namespace: neuropause
  labels:
    app.kubernetes.io/name: neuropause-backend
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.neuropause.example
      secretName: neuropause-backend-tls
  rules:
    - host: api.neuropause.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neuropause-backend
                port:
                  number: 80
